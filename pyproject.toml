[project]
name = "bpto"
version = "0.1.0"
description = "Bayesian Prompt Tree Optimization"
requires-python = ">=3.12"
dependencies = ["anthropic>=1.0", "pydantic>=2.0", "httpx", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
qei = ["quantecarlo>=0.7.1"]   # bpto.bo.QuantecarloQEI: hosted joint q-EI over the local surrogate's posterior

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bpto*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
